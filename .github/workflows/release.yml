name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build App
        run: |
          xcodebuild -project BridgeTouch.xcodeproj \
                     -scheme BridgeTouch \
                     -configuration Release \
                     -derivedDataPath build_output \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=YES \
                     CODE_SIGNING_ALLOWED=YES \
                     clean build

      - name: Zip App Bundle
        run: |
          cd build_output/Build/Products/Release
          zip -r ../../../../BridgeTouch.zip BridgeTouch.app

      - name: Parse Version and Beta
        id: parse_version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION_PART=$(echo "$TAG_NAME" | sed -E 's/^v//')
          
          if [[ "$VERSION_PART" == *"-beta"* ]]; then
            VERSION=$(echo "$VERSION_PART" | cut -d'-' -f1)
            BETA_NUM=$(echo "$VERSION_PART" | sed -E 's/.*-beta\.?([0-9]+)/\1/')
            RELEASE_NAME="BridgeTouch v${VERSION} Developer Beta ${BETA_NUM}"
            IS_PRERELEASE="true"
          elif [[ "$VERSION_PART" == *"-alpha"* ]]; then
            VERSION=$(echo "$VERSION_PART" | cut -d'-' -f1)
            ALPHA_NUM=$(echo "$VERSION_PART" | sed -E 's/.*-alpha\.?([0-9]+)/\1/')
            RELEASE_NAME="BridgeTouch v${VERSION} Developer Alpha ${ALPHA_NUM}"
            IS_PRERELEASE="true"
          else
            RELEASE_NAME="BridgeTouch v${VERSION_PART}"
            IS_PRERELEASE="false"
          fi
          
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: BridgeTouch.zip
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          name: ${{ env.RELEASE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
